  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. Initialize Shared Layout Shell
      if (window.FileRoomLayout && typeof window.FileRoomLayout.init === "function") {
        window.FileRoomLayout.init({
          portal: 'client',
          activePage: 'signatures',
          breadcrumbs: [
            { title: 'The File Room', href: 'index.html' },
            { title: 'Client Portal', href: 'dashboard.html' },
            { title: 'Sign Form 8879' }
          ]
        });
      }

      // 2. Initialize Live Client Signatures Controller
      if (window.ClientSignatures) {
        window.ClientSignatures.init();
      }

      // 3. Interactive States Verification Controls
      var contentArea = document.getElementById('signatures-content-area');
      var btnLive = document.getElementById('btn-state-live');
      var btnLoading = document.getElementById('btn-state-loading');
      var btnEmpty = document.getElementById('btn-state-empty');
      var btnError = document.getElementById('btn-state-error');
      var allStateBtns = [btnLive, btnLoading, btnEmpty, btnError];

      function setActiveBtn(btn) {
        allStateBtns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      }

      btnLive.addEventListener('click', function () {
        setActiveBtn(btnLive);
        if (window.ClientSignatures) {
          window.ClientSignatures.render();
        }
        FileRoomLayout.showToast('Displaying Form 8879 Signature Requests', 'info');
      });

      btnLoading.addEventListener('click', function () {
        setActiveBtn(btnLoading);
        FileRoomLayout.renderLoading(contentArea, 'Connecting to DocuSign Connect webhook & KBA ledger...');
      });

      btnEmpty.addEventListener('click', function () {
        setActiveBtn(btnEmpty);
        FileRoomLayout.renderEmpty(contentArea, {
          icon: '🎉',
          title: 'All Form 8879 Authorizations Executed',
          desc: 'Both Primary Taxpayer and Spouse signatures have been verified and recorded with tamper-evident WORM timestamps. Return is queued for IRS MeF transmission.',
          actionText: 'View Transmission Queue',
          actionHref: 'tax-return.html'
        });
      });

      btnError.addEventListener('click', function () {
        setActiveBtn(btnError);
        FileRoomLayout.renderError(contentArea, {
          icon: '⚠',
          title: 'Signing Envelope Synchronization Interrupted',
          desc: 'Unable to reach DocuSign eSignature endpoint or retrieve KBA challenge tokens. Please verify internet connectivity.',
          onRetry: function () {
            btnLive.click();
          }
        });
      });
    });
  </script>
