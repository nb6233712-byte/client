  <!-- Dual Device Stage Container -->
  <div class="stage desk-mode" id="stage">
    <div class="device desk" id="device">

      <!-- Phone Notch (Active in Phone Mode) -->
      <div class="notch"><span>9:41</span><span class="dot"></span><span>●●●●</span></div>

      <!-- Main Application Container -->
      <div class="app" id="app">

        <!-- Top Application Bar (Injected by layout.js) -->
        <header class="appbar"></header>

        <!-- Main Workspace (Sidebar + Scrollable Content) -->
        <div class="workspace">

          <!-- Drawer Backdrop for Mobile Drawer -->
          <div class="drawer-backdrop" id="drawer-backdrop"></div>

          <!-- Desktop Sidebar Navigation / Mobile Drawer (Injected by layout.js) -->
          <aside class="side" id="side" aria-label="Firm Console Navigation"></aside>

          <!-- Scrollable Main Content Body -->
          <main class="body" id="body">

            <!-- Breadcrumbs -->
            <div id="page-breadcrumbs"></div>

            <!-- Page Header Row -->
            <div class="page-header-row">
              <div class="page-title-wrap">
                <h1>Clients &amp; Pipeline</h1>
                <p class="page-subtitle">Authorized Client Portfolio &middot; 24 Active Tax Engagements &middot; Circular 230 Practice Governance</p>
              </div>
              <div class="page-actions-wrap">
                <a href="dashboard.html" class="btn sm btn-o">&larr; Operations Triage</a>
                <a href="workflow.html" class="btn sm btn-b">Missing Docs Chaser &rarr;</a>
              </div>
            </div>

            <!-- Search & Filters Toolbar Card -->
            <div class="card" style="padding:16px 20px;background:var(--surface);margin-bottom:18px;border:1px solid var(--line);border-radius:var(--radius-md)">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
                <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:280px">
                  <input type="text" id="client-search-input" placeholder="Search by client name, email, or UID..." style="flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.82rem;font-family:var(--f-body);background:var(--surface-2);color:var(--ink)">
                </div>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                  <select id="filter-stage-select" style="padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.8rem;font-family:var(--f-body);background:var(--surface-2);color:var(--ink)">
                    <option value="all">All Workflow Stages</option>
                    <option value="1">Stage 1: Intake Opened</option>
                    <option value="2">Stage 2: Checklist Upload</option>
                    <option value="3">Stage 3: In Preparation</option>
                    <option value="4">Stage 4: Return Review</option>
                    <option value="5">Stage 5: Sign Form 8879</option>
                    <option value="6">Stage 6: IRS Transmitted</option>
                  </select>
                  <select id="filter-preparer-select" style="padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.8rem;font-family:var(--f-body);background:var(--surface-2);color:var(--ink)">
                    <option value="all">All Assigned Preparers</option>
                    <option value="Denise">Denise R., CPA</option>
                    <option value="Marcus">Marcus Chen, EA</option>
                    <option value="Managing Partner">Managing Partner</option>
                  </select>
                  <span class="chip gold sm" id="clients-count-badge" style="font-weight:600">Loading...</span>
                </div>
              </div>
            </div>

            <!-- Interactive States Verification Bar -->
            <div class="states-demo-bar">
              <span class="states-demo-label">PIPELINE STATE:</span>
              <button type="button" class="states-demo-btn active" id="btn-state-live">● Live Roster</button>
              <button type="button" class="states-demo-btn" id="btn-state-loading">Loading State</button>
              <button type="button" class="states-demo-btn" id="btn-state-empty">Empty State</button>
              <button type="button" class="states-demo-btn" id="btn-state-error">Error State</button>
            </div>

            </div>

  <!-- Scripts -->

  <script src="../js/firm/clients.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Initialize Shared Layout
      FileRoomLayout.init({
        portal: 'firm',
        activePage: 'clients',
        breadcrumbs: [
          { title: 'The File Room', href: '../index.html' },
          { title: 'Firm Console', href: 'dashboard.html' },
          { title: 'Clients & Pipeline' }
        ]
      });

      // Initialize Firm Clients Controller
      if (window.FirmClients) {
        window.FirmClients.init();
      }

      // Interactive States Demo Logic
      var contentArea = document.getElementById('clients-table-container');

      var btnLive = document.getElementById('btn-state-live');
      var btnLoading = document.getElementById('btn-state-loading');
      var btnEmpty = document.getElementById('btn-state-empty');
      var btnError = document.getElementById('btn-state-error');
      var allStateBtns = [btnLive, btnLoading, btnEmpty, btnError];

      function setActiveBtn(btn) {
        allStateBtns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      }

      btnLive.addEventListener('click', function () {
        setActiveBtn(btnLive);
        if (window.FirmClients) {
          window.FirmClients.render();
        }
        FileRoomLayout.showToast('Displaying Authorized Client Portfolio', 'info');
      });

      btnLoading.addEventListener('click', function () {
        setActiveBtn(btnLoading);
        FileRoomLayout.renderLoading(contentArea, 'Synchronizing authorized client pipeline from Cloud Firestore...');
      });

      btnEmpty.addEventListener('click', function () {
        setActiveBtn(btnEmpty);
        FileRoomLayout.renderEmpty(contentArea, {
          icon: '👥',
          title: 'Zero Client Records Found',
          desc: 'No client accounts match the active search criteria or workflow stage filters.',
          actionText: 'Reset Filters',
          actionHref: 'clients.html'
        });
      });

      btnError.addEventListener('click', function () {
        setActiveBtn(btnError);
        FileRoomLayout.renderError(contentArea, {
          icon: '⚠',
          title: 'Failed to Retrieve Client Portfolio',
          desc: 'Firestore query to /clients was rejected or timed out. Ensure supervisory credentials and MFA are active.',
          onRetry: function () {
            btnLive.click();
          }
        });
      });
    });
  </script>
