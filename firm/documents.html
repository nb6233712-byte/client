<body>
  <div class="stage desk-mode" id="stage">
    <div class="device desk" id="device">
      <div class="notch"><span>9:41</span><span class="dot"></span><span>●●●●</span></div>

      <div class="app" id="app">
        <header class="appbar"></header>

        <div class="workspace">
          <div class="drawer-backdrop" id="drawer-backdrop"></div>
          <aside class="side" id="side" aria-label="Firm Operations Navigation"></aside>

          <main class="body" id="body">
            <div id="page-breadcrumbs"></div>

            <div class="page-header-row">
              <div class="page-title-wrap">
                <h1>Document Intake &amp; Exception Review</h1>
                <p class="page-subtitle">Practitioner Ingestion, Vault Custody &amp; Diligence &middot; Treasury Circular 230 § 10.22 Verified</p>
              </div>
              <div class="page-actions-wrap" style="display:flex;gap:8px;">
                <a href="dashboard.html" class="btn sm btn-o">&larr; Operations Triage</a>
                <a href="delivery-queue.html" class="btn sm btn-b" id="btn-delivery-queue-dlo">⚡ Delivery Queue &amp; DLO</a>
              </div>
            </div>

            <!-- Review Queue State Demo Controls -->
            <div class="states-demo-bar" style="margin-bottom:16px;">
              <span class="states-demo-label">REVIEW QUEUE STATE:</span>
              <button type="button" class="states-demo-btn active" id="btn-state-live">● Live View</button>
              <button type="button" class="states-demo-btn" id="btn-state-loading">Loading State</button>
              <button type="button" class="states-demo-btn" id="btn-state-empty">Empty State</button>
              <button type="button" class="states-demo-btn" id="btn-state-error">Error State</button>
            </div>

            <!-- Authoritative Document Intake & Exception Review Container -->
            <div id="docs-review-content-area"></div>

          </main>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card modal-wide" id="modal-container"></div>
  </div>
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="../js/firebase.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/core/layout.js"></script>
  <script src="../js/firm/documents.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      FileRoomLayout.init({
        portal: 'firm',
        activePage: 'documents',
        breadcrumbs: [
          { title: 'The File Room', href: '../index.html' },
          { title: 'Firm Operations', href: 'dashboard.html' },
          { title: 'Document Intake & Exception Review' }
        ]
      });

      function initIntakeConsole() {
        var user = (typeof AuthGuard !== 'undefined' && AuthGuard.getCurrentUser && AuthGuard.getCurrentUser()) || (window.FirebaseBridge && window.FirebaseBridge.currentUser);
        var isStaff = Boolean(
          user && (
            user.role === 'firm_admin' ||
            user.role === 'firm_partner' ||
            user.role === 'firm_reviewer' ||
            user.role === 'firm_preparer' ||
            user.role === 'firm_staff' ||
            user.isStaff
          )
        );

        var contentArea = document.getElementById('documents-content-area') || document.querySelector('.page-content');
        if (user && !isStaff) {
          if (contentArea && typeof FileRoomLayout !== 'undefined' && typeof FileRoomLayout.renderAccessDenied === 'function') {
            FileRoomLayout.renderAccessDenied(contentArea, {
              title: '403 FORBIDDEN · ACCESS RESTRICTED',
              message: 'Staff credentials and verified Multi-Factor Authentication (MFA) are required to access Firm Operations Console under FTC Safeguards § 314.4.',
              loginUrl: '../index.html'
            });
            return;
          }
        }

        if (window.FirmDocuments && typeof window.FirmDocuments.init === 'function') {
          window.FirmDocuments.init();
        }
      }

      // Storage Vault Document Viewer Bridge Handler
      function buildVaultViewLink(item) {
        return '<a href="javascript:void(0)" class="view-vault-link" data-doc-id="' + (item.docId || '') + '" data-client="' + (item.client || '') + '" data-name="' + (item.name || '') + '" data-url="' + (item.downloadUrl || '') + '"><span>📄</span> View in Storage Vault &nearr;</a>';
      }

      function bindVaultDocumentViewer(container) {
        if (!container) return;
        var links = container.querySelectorAll('.view-vault-link');
        links.forEach(function (link) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            var docId = link.getAttribute('data-doc-id');
            var client = link.getAttribute('data-client');
            var name = link.getAttribute('data-name');
            var url = link.getAttribute('data-url');
            if (window.FileRoomLayout && typeof window.FileRoomLayout.openVaultDocumentViewer === 'function') {
              window.FileRoomLayout.openVaultDocumentViewer({
                docId: docId,
                title: name,
                client: client,
                downloadUrl: url
              });
            }
          });
        });
      }

      if (window.FirebaseBridge) {
        initIntakeConsole();
      } else {
        var attempts = 0;
        var timer = setInterval(function () {
          attempts++;
          if (window.FirebaseBridge || attempts >= 15) {
            clearInterval(timer);
            initIntakeConsole();
          }
        }, 100);
        window.addEventListener('firebase-bridge-ready', function () { clearInterval(timer); initIntakeConsole(); }, { once: true });
        window.addEventListener('firebase-ready', function () { clearInterval(timer); initIntakeConsole(); }, { once: true });
        setTimeout(initIntakeConsole, 1500);
      }
    });
  </script>
</body>

</html>
